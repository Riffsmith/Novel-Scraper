# Example job file for `wnscrape run --job <file>`.
# Schema: schemas/job.schema.json (generated by `pnpm gen:schema`).
method: toc                      # toc | sequential
tocUrl: https://wtr-lab.com/series/some-novel/?tab=toc
outputDir: ./output
outputFilename: some-novel
headless: true
concurrency: 2
delayMin: 1200
delayMax: 3500

output:
  epub: true

contentSelector: ".chapter-content"
separateTitle: false
titleSelector: ""
excludeSelectors: []

metadata:
  title: "Some Novel"
  author: "Unknown"
  language: "en"
  coverSource: "none"
  publisher: "WebNovel Scraper"
